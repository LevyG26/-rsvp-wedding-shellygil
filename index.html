<!doctype html>
<!-- lang="he" (not "en") to match the actual page content from the very
     first paint - React only corrects this after mount, but Chrome/Google
     Translate detect language almost immediately on load, before that JS
     runs. A static "en" tag around Hebrew text is exactly the mismatch that
     was triggering an auto-translate prompt/action on every visit (even the
     very first cover screen) regardless of language chosen in-app, which in
     turn was corrupting letters via live DOM text mutation. translate="no"
     plus the notranslate meta tag below tell Chrome/Google Translate not to
     touch this page at all, which is the definitive fix. -->
<html lang="he" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- Blocks search engines from indexing/crawling the site at all - this
         is a private invite page, not something meant to be discoverable by
         searching "wedding" or the couple's names. A stranger finding the
         RSVP form via Google (rather than a link actually sent to them) is
         exactly the scenario this prevents going forward; it doesn't retroactively
         remove a page already indexed - that needs a manual removal request
         in Google Search Console. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Wedding | Shelly & Gil</title>
    <link rel="icon" type="image/png" href="/src/assets/logo-sg-dark.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo-sg-dark.png" />
    <meta name="description" content="RSVP for the wedding." />
    <meta property="og:title" content="Wedding | Shelly & Gil" />
    <meta property="og:description" content="Join us in celebrating our wedding." />
    <meta property="og:type" content="website" />
    <!-- Absolute URL, pointing at a file in /public (served as-is, not
         processed/hashed by Vite) - link-preview crawlers (WhatsApp, Safari,
         etc.) need a real, fully-qualified image URL to fetch; a relative
         src/assets path either 404s in the production build or gets ignored
         entirely, which is why no preview image was showing before.
         Now pointing at the real shellygilwedding.com domain, since Gil's
         Wix DNS cutover is live and confirmed working. -->
    <meta property="og:url" content="https://shellygilwedding.com/" />
    <meta property="og:image" content="https://shellygilwedding.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shellygilwedding.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
