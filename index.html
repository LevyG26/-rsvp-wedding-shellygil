<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding | Shelly & Gil</title>
    <link rel="icon" type="image/png" href="/src/assets/logo-sg-dark.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo-sg-dark.png" />
    <meta name="description" content="RSVP for the wedding." />
    <meta property="og:title" content="Wedding | Shelly & Gil" />
    <meta property="og:description" content="Join us in celebrating our wedding." />
    <meta property="og:type" content="website" />
    <!-- Absolute URL, pointing at a file in /public (served as-is, not
         processed/hashed by Vite) - link-preview crawlers (WhatsApp, Safari,
         etc.) need a real, fully-qualified image URL to fetch; a relative
         src/assets path either 404s in the production build or gets ignored
         entirely, which is why no preview image was showing before.
         NOTE: update this domain once the real shellygilwedding.com redirect
         is live (Gil is handling that separately via Wix). -->
    <meta property="og:url" content="https://shelly-gil-wedding-dashboard.vercel.app/" />
    <meta property="og:image" content="https://shelly-gil-wedding-dashboard.vercel.app/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shelly-gil-wedding-dashboard.vercel.app/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
